version: 1.0
jobs:
  Build_and_Scan:
    name: "Build and Security Scan"
    parameters:
      env.TEAMCITY_EXAMPLE: "enabled"
      env.POLARIS_API_TOKEN: "xxxxx"
      env.POLARIS_SERVER_URL: "xxxxx"
    runs-on: Linux-Medium

    # TeamCity-specific classifier signals
    # Keep runs-on values within supported TeamCity agent-pool values.
    dependencies:
      - name: "Build Dependencies"
        reuse: true
        download-artifacts: true
        artifact-rules: "**/* => artifacts"
    integrations:
      - name: "Example integration"
    import-parameters: true
    credentialsJSON: "{}"
    enable-dependency-cache: true
    allow-reuse: true
    files-publication:
      - "**/dist/**"
    artifact-rules: "**/* => artifacts"
    steps:
      - name: "Compile Application"
        type: script
        use-gradle-wrapper: false
        pom-location: "pom.xml"
        script-content: |
          echo "Install dependencies..."
          npm install
      - name: "Run Unit Tests"
        type: script
        script-content: |
          echo "Running tests..."
          npm test