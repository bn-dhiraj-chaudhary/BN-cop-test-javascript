version: "1"
project:
  name: LSAG-SID-OpenLab-XDSACQAPI
  branch: ${scm.git.branch}
  revision:
    name: ${scm.git.commit}
    date: ${scm.git.commit.date}

capture:
  build:
    cleanCommands:
      - shell: [dotnet, clean, acq-api.sln, --configuration, Release]
    buildCommands:
      - shell: [dotnet, build, ${SOLUTION_FILE}, --configuration, ${BUILD_CONFIGURATION}]
    coverity:
      skipFiles: ["/tests"]

analyze:
  mode: central

install:
  coverity:
    version: default

serverUrl: https://agilent.polaris.synopsys.com